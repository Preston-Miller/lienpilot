<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LienPilot Clinic Dashboard</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    /* LienPilot brand: navy + Pilot blue from the wordmark, leather brown and cream
       from the helmet. Blue = actions and collected money; brown = needs attention;
       grey = outstanding money in the chart and its strip key. Dark mode re-steps the same palette on navy (chart pair
       validated for colorblind separation on both surfaces). */
    :root {
      --bg: #f4f2ed;           /* page: warm off-white behind the cards */
      --surface: #ffffff;
      --sunken: #f8f7f3;       /* expanded groups, chat bubbles */
      --ink: #0a1c34;          /* brand navy */
      --ink-2: #33445c;
      --muted: #66738a;
      --line: #e4e1da;
      --line-strong: #0a1c34;
      --track: #ebe8e1;
      --hover: #f7f5f0;
      --accent: #0088fe;       /* "Pilot" blue: marks */
      --accent-ink: #0068c9;   /* blue for text and buttons (4.5:1 on white) */
      --on-accent: #ffffff;
      --accent-tint: #eaf4ff;
      --brown: #825133;        /* helmet leather: fills */
      --brown-ink: #825133;    /* brown for text */
      --cream: #fbf5ee;
      --header-bg: #0a1c34;
      --header-ink: #fbf5ee;
      --header-muted: #9fb0c6;
      --collected: #0088fe;
      --outstanding: #8a929e;   /* neutral grey: still owed */
      --outstanding-edge: #5f6875;
      --shadow: 0 1px 2px rgba(10, 28, 52, 0.06), 0 4px 14px rgba(10, 28, 52, 0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #06111f;
        --surface: #0c1d35;
        --sunken: #0a182c;
        --ink: #f3eee6;
        --ink-2: #c9d2de;
        --muted: #8e9bb0;
        --line: #1d3150;
        --line-strong: #f3eee6;
        --track: #17294a;
        --hover: #11243f;
        --accent: #29affe;
        --accent-ink: #5cc1ff;
        --on-accent: #06111f;
        --accent-tint: #0f2a4a;
        --brown: #825133;
        --brown-ink: #e0a77a;
        --header-bg: #040c17;
        --header-ink: #f3eee6;
        --header-muted: #8e9bb0;
        --collected: #1c97ee;
        --outstanding: #6b7686;
        --outstanding-edge: #a3adbb;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }
    .num { font-variant-numeric: tabular-nums; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 24px;
      background: var(--header-bg);
      color: var(--header-ink);
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 20px; letter-spacing: -0.02em; }
    .brand-logo { width: 38px; height: 38px; flex: none; }
    .wordmark { font-weight: 800; color: var(--header-ink); }
    .wordmark b { font-weight: 800; color: #29affe; }   /* the logo's eye blue: reads on navy */
    header h1 .sub { font-size: 14px; font-weight: 500; letter-spacing: 0; color: var(--header-muted); padding-left: 12px; margin-left: 2px; border-left: 1px solid rgba(255, 255, 255, 0.18); }
    .header-meta { display: flex; gap: 16px; align-items: center; color: var(--header-muted); font-size: 13px; white-space: nowrap; }
    .header-meta a { color: var(--header-ink); font-weight: 600; text-decoration: none; padding: 5px 12px; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px; }
    .header-meta a:hover { background: rgba(255, 255, 255, 0.08); }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(400px, 1.6fr) minmax(280px, 1fr);
      gap: 16px;
      padding: 16px 24px 24px;
    }
    section {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .col-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--line);
    }
    .col-head h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .col-head .count { color: var(--muted); font-size: 12px; }
    .scroll { flex: 1; min-height: 0; overflow-y: auto; }
    /* Room at the end of each list so the last item scrolls clear of the chat circle. */
    #cases, #actions { padding-bottom: 96px; }
    .empty { padding: 20px; color: var(--muted); }

    /* ---- Cases (left) ---- */
    .case {
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
    }
    .case:hover { background: var(--hover); }
    .case-top { display: flex; justify-content: space-between; gap: 12px; }
    .case-name { font-weight: 600; }
    .case-amount { font-weight: 600; white-space: nowrap; }
    .case-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .case-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--sunken);
      color: var(--ink-2);
      white-space: nowrap;
    }
    .tag.solid { background: var(--brown); border-color: var(--brown); color: var(--cream); }   /* needs attention */
    .tag.quiet { background: var(--accent-tint); border-color: transparent; color: var(--accent-ink); }

    /* ---- Summary strip: the four numbers that say whether anything is slipping ---- */
    /* Money: outstanding, collected, average reduction. */
    .summary {
      display: grid; grid-template-columns: repeat(3, 1fr);
      margin: 16px 24px 0; background: var(--surface);
      border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
    }
    .stat { padding: 16px 24px; border-right: 1px solid var(--line); border-top: 3px solid var(--key, var(--ink)); }
    .stat:nth-child(1) { --key: var(--outstanding); }   /* same colors as the chart's series */
    .stat:nth-child(2) { --key: var(--collected); }
    .stat:last-child { border-right: none; }
    .stat-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .stat-value { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-top: 2px; color: var(--ink); }
    .stat-sub { color: var(--muted); font-size: 12px; }
    /* ---- Middle: open liens by stage, pipeline order, as bars ---- */
    #stages { padding: 12px 24px 0; }

    /* ---- Middle, below the stages: collected vs outstanding over time ---- */
    .svc { padding: 18px 24px 24px; border-top: 1px solid var(--line); margin-top: 12px; }
    .svc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .svc-title { font-size: 13.5px; font-weight: 600; }
    .svc-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .link-btn { font: inherit; font-size: 12px; font-weight: 600; background: none; border: 0; padding: 0; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; white-space: nowrap; }
    .legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); margin: 10px 0 6px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
    .sw.collected { background: var(--collected); }
    .sw.outstanding { background: var(--outstanding); }
    #svc-plot { position: relative; }
    #svc-table { max-height: 260px; overflow-y: auto; }
    #svc-plot svg { display: block; overflow: visible; }
    #svc-plot text { fill: var(--muted); font-size: 11px; font-family: inherit; }
    .svc-grid { stroke: var(--line); stroke-width: 1; }
    .svc-base { stroke: var(--line-strong); stroke-width: 1; }
    .svc-collected { fill: var(--collected); }
    .svc-outstanding { fill: var(--outstanding); }
    .svc-gap { fill: none; stroke: var(--surface); stroke-width: 2; }  /* 2px surface gap between the two areas */
    .svc-edge { fill: none; stroke: var(--outstanding-edge); stroke-width: 1.5; }
    .svc-cross { stroke: var(--ink); stroke-width: 1; opacity: 0; }
    .svc-dot { fill: var(--surface); stroke: var(--ink); stroke-width: 2; opacity: 0; }
    #svc-plot.hover .svc-cross, #svc-plot.hover .svc-dot { opacity: 1; }
    .svc-tip {
      position: absolute; top: 0; pointer-events: none; z-index: 5;
      background: var(--header-bg); color: var(--header-ink); font-size: 12px; line-height: 1.5;
      padding: 7px 10px; border-radius: 6px; white-space: nowrap; opacity: 0;
      box-shadow: 0 4px 14px rgba(10, 28, 52, 0.25);
    }
    #svc-plot.hover .svc-tip { opacity: 1; }
    .svc-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
    .svc-table th, .svc-table td { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: right; }
    .svc-table th:first-child, .svc-table td:first-child { text-align: left; }
    .svc-table th { font-weight: 600; color: var(--ink-2); }
    .stage { padding: 10px 0; }
    .stage-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
    .stage-name { font-size: 13.5px; font-weight: 600; }
    .stage-amt { color: var(--muted); font-size: 12.5px; font-weight: 400; margin-left: 8px; }
    .stage-n { font-size: 18px; font-weight: 700; line-height: 1; }
    .stage.zero .stage-name, .stage.zero .stage-n { color: var(--muted); font-weight: 400; }
    .stage-track { display: block; height: 14px; background: var(--track); border-radius: 0 4px 4px 0; }
    .stage-fill { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; } /* a zero still reads as present */
    .stage:hover .stage-fill { opacity: 0.75; }

    /* ---- Case detail: opens from a case row ---- */
    .case { cursor: pointer; }
    .case:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    dialog.case-dialog {
      border: 1px solid var(--line); border-radius: 14px; padding: 0;
      width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
      background: var(--surface); color: var(--ink);
      box-shadow: 0 24px 60px rgba(10, 28, 52, 0.28);
    }
    dialog.case-dialog[open] { display: flex; flex-direction: column; }
    dialog.case-dialog::backdrop { background: rgba(6, 17, 31, 0.45); }
    .cd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
    .cd-head h3 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
    .cd-head .case-tags { margin-top: 8px; }
    .cd-close { font: inherit; font-size: 22px; line-height: 1; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 4px; }
    .cd-close:hover { color: var(--ink); }
    /* The body is a column: everything above Activity keeps its height and Activity
       scrolls on its own in what's left. On a short screen Activity holds at least
       180px and the whole body scrolls instead. */
    .cd-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 22px; display: flex; flex-direction: column; }
    .cd-body > * { flex: none; }
    .cd-section { padding-top: 16px; }
    .cd-body > .cd-activity { flex: 1 1 auto; min-height: 180px; display: flex; flex-direction: column; }
    .cd-activity .cd-log { flex: 1; min-height: 0; overflow-y: auto; padding-top: 2px; }
    .cd-section h4, .cd-summary h4 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .cd-facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 20px; margin: 0; }
    .cd-facts dt { font-size: 12px; color: var(--muted); }
    .cd-facts dd { margin: 1px 0 0; font-size: 13.5px; }
    .cd-req { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .cd-req:last-child { border-bottom: none; }
    .cd-req .action-cat { margin-bottom: 2px; }
    .cd-req .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .cd-req a { color: var(--accent-ink); font-weight: 600; font-size: 12px; }
    .cd-none { color: var(--muted); font-size: 13px; }
    .cd-summary { margin-top: 16px; padding: 12px 14px; background: var(--accent-tint); border-left: 3px solid var(--accent); border-radius: 8px; font-size: 14px; }
    .cd-summary h4 { color: var(--accent-ink); }
    .cd-summary p { margin: 0; }
    .cd-summary .next { margin-top: 6px; font-weight: 600; }
    .cd-summary .note { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
    .cd-summary.loading p { color: var(--muted); }
    .cd-log { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
    .cd-log li { position: relative; padding: 0 0 12px 16px; font-size: 13px; color: var(--ink-2); }
    .cd-log li::before { content: ""; position: absolute; left: -4px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .cd-log .when { display: block; font-size: 11.5px; color: var(--muted); }
    @media (max-width: 520px) {
      .cd-facts { grid-template-columns: 1fr; }
      /* Too little height for a scroll inside a scroll: the whole panel scrolls as one. */
      .cd-body > .cd-activity { flex: none; min-height: 0; }
      .cd-activity .cd-log { overflow: visible; }
    }

    /* Payment received: amount dialog */
    dialog.pay-dialog { border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(360px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); box-shadow: 0 24px 60px rgba(10, 28, 52, 0.28); }
    dialog.pay-dialog::backdrop { background: rgba(6, 17, 31, 0.45); }
    .pay-dialog h3 { margin: 0 0 4px; font-size: 16px; }
    .pay-dialog p { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
    .pay-dialog label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
    .pay-amount { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
    .pay-amount:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
    .pay-amount input { flex: 1; border: 0; outline: 0; font: inherit; font-size: 18px; padding: 8px 6px; background: transparent; color: var(--ink); }
    .pay-err { color: var(--brown-ink); font-size: 12.5px; font-weight: 600; min-height: 18px; margin-top: 6px; }
    .pay-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .pay-actions .pay-btn { padding: 6px 14px; font-size: 13px; }
    /* ---- Actions (right) ---- */
    .action {
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
    }
    .action-cat { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--brown-ink); }
    .action-who { margin-top: 3px; font-weight: 600; }
    .action-text { margin-top: 3px; color: var(--ink-2); font-size: 13px; }
    .action-age { margin-top: 4px; color: var(--muted); font-size: 12px; }
    a.action { display: block; color: inherit; text-decoration: none; }
    a.action:hover { background: var(--hover); }
    a.action:hover .action-open { text-decoration: underline; }
    .action-open { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--accent-ink); }

    /* Stacked: the page grows and scrolls instead of fitting the window. */
    /* ---- Expandable groups: attorneys (left), clinic desks (right) ---- */
    details.group { border-bottom: 1px solid var(--line); }
    details.group > summary {
      list-style: none; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 20px 12px 16px;
    }
    details.group > summary::-webkit-details-marker { display: none; }
    details.group > summary::before {
      content: "\203A"; font-size: 18px; line-height: 1; color: var(--muted);
      transition: transform 0.15s; flex: none; width: 10px;
    }
    details.group[open] > summary::before { transform: rotate(90deg); }
    details.group > summary:hover { background: var(--hover); }
    .attorney-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .attorney-name { font-weight: 600; }
    .attorney-firm { color: var(--muted); font-size: 12.5px; }
    .attorney-side { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
    .attorney-total { font-weight: 600; white-space: nowrap; }
    .attorney-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .attorney-count b { color: var(--brown-ink); font-weight: 700; }
    .attorney-cases { border-top: 1px solid var(--line); background: var(--sunken); }
    .attorney-cases .case { padding-left: 34px; }
    .attorney-cases .case:last-child { border-bottom: none; }

    .group-empty { padding: 10px 20px 12px 34px; color: var(--muted); font-size: 12.5px; }
    .attorney-cases .action { padding-left: 34px; }
    .attorney-cases .action:last-child { border-bottom: none; }

    /* ---- Received payment? (Payment Pending / Payment Sent cases) ---- */
    .pay-confirm { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12.5px; }
    .pay-confirm span { font-weight: 600; margin-right: 2px; }
    .pay-btn {
      font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
      padding: 3px 12px; border-radius: 6px;
      border: 1px solid var(--accent-ink); background: var(--surface); color: var(--accent-ink);
    }
    .pay-btn.yes { background: var(--accent-ink); color: var(--on-accent); }
    .pay-btn:hover { opacity: 0.85; }
    .pay-btn:disabled { opacity: 0.4; cursor: default; }
    .pay-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---- Ask LienPilot drawer ---- */
    /* Chat launcher: a circle pinned bottom-right; the chat pops up above it. */
    .chat-fab {
      position: fixed; right: 24px; bottom: 24px; z-index: 22;
      width: 56px; height: 56px; border-radius: 50%;
      border: 0; background: var(--accent-ink); color: var(--on-accent);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 104, 201, 0.35);
      cursor: pointer; transition: transform 0.12s ease;
    }
    .chat-fab:hover { transform: scale(1.06); }
    .chat-fab svg { width: 24px; height: 24px; }
    .chat-fab .icon-close { display: none; }
    body.drawer-open .chat-fab .icon-chat { display: none; }
    body.drawer-open .chat-fab .icon-close { display: block; }
    .drawer {
      position: fixed; right: 24px; bottom: 92px; z-index: 21;
      width: min(380px, calc(100vw - 48px));
      height: min(560px, calc(100vh - 124px));
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 24px 60px rgba(10, 28, 52, 0.28);
      display: flex; flex-direction: column; overflow: hidden;
      opacity: 0; pointer-events: none;
      transform: translateY(12px) scale(0.98); transform-origin: bottom right;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    body.drawer-open .drawer { opacity: 1; pointer-events: auto; transform: none; }
    /* Phone width: the chat takes the whole screen; the circle stays as the close button. */
    @media (max-width: 520px) {
      .drawer { right: 0; bottom: 0; width: 100vw; height: 100vh; border: none; border-radius: 0; }
      .chat-fab { right: 16px; bottom: 16px; }
      body.drawer-open .composer { padding-right: 88px; }
    }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 14px 16px; background: var(--header-bg); color: var(--header-ink);
    }
    .drawer-head h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .drawer-head .tools { display: flex; gap: 6px; }
    .ghost-btn {
      font: inherit; font-size: 12px; color: var(--header-ink); background: none;
      border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px; padding: 3px 9px; cursor: pointer;
    }
    .ghost-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .chat { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 90%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; font-size: 13.5px; }
    .msg.staff { align-self: flex-end; background: var(--accent-ink); color: var(--on-accent); border-bottom-right-radius: 3px; }
    .msg.lienpilot { align-self: flex-start; background: var(--sunken); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
    .msg.error { align-self: flex-start; border: 1px dashed var(--line-strong); color: var(--ink-2); }
    .msg.thinking { align-self: flex-start; color: var(--muted); border: 1px solid var(--line); }
    .msg details { margin-top: 8px; }
    .msg summary { cursor: pointer; font-size: 12px; color: var(--muted); }
    .msg details pre { margin: 6px 0 0; font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; color: var(--ink-2); }
    .chat-empty { color: var(--muted); font-size: 13px; }
    .chat-empty p { margin: 0 0 10px; }
    .suggestion {
      display: block; width: 100%; text-align: left; margin-top: 6px;
      font: inherit; font-size: 13px; color: var(--ink); background: none;
      border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer;
    }
    .suggestion:hover { border-color: var(--accent); background: var(--accent-tint); }
    .composer { border-top: 1px solid var(--line); padding: 12px 16px 16px; }
    .composer textarea {
      width: 100%; min-height: 44px; max-height: 140px; resize: vertical;
      font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    }
    .composer textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
    .chat-fab:focus-visible, .ghost-btn:focus-visible, .send-btn:focus-visible, .suggestion:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .composer-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .composer-hint { font-size: 11.5px; color: var(--muted); }
    .send-btn {
      font: inherit; font-size: 13px; font-weight: 600; color: var(--on-accent); background: var(--accent-ink);
      border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer;
    }
    .send-btn:disabled { opacity: 0.4; cursor: default; }

    @media (max-width: 1040px) {
      html, body { height: auto; }
      body { display: block; }
      header { flex-wrap: wrap; padding: 10px 16px; }
      main { display: block; padding: 12px 12px 24px; }
      section { margin-bottom: 12px; }
      #cases { padding-bottom: 0; }   /* only the last list needs room for the chat circle */
      .summary { margin: 12px 12px 0; }
      .scroll { overflow: visible; }
      .col-head, .case, .action { padding-left: 16px; padding-right: 16px; }
      .stat { padding: 12px 16px; }
      #stages { padding-left: 16px; padding-right: 16px; }
      .svc { padding-left: 16px; padding-right: 16px; }
    }
    @media (max-width: 560px) {
      .summary { grid-template-columns: repeat(2, 1fr); }
      .stat:first-child { grid-column: 1 / -1; border-right: none; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1><img class="brand-logo" src="/logo.png" alt="" /><span class="wordmark">Lien<b>Pilot</b></span><span class="sub">Clinic dashboard</span></h1>
    <div class="header-meta">
      <span id="as-of" class="num"></span>
      <a href="/">Agent console</a>
    </div>
  </header>

  <div class="summary">
    <div class="stat" title="Every lien not yet Payment Sent, Paid, or Closed, at its agreed payoff if a reduction was accepted.">
      <div class="stat-label">Outstanding</div>
      <div id="open-value" class="stat-value num">—</div>
      <div id="open-sub" class="stat-sub num"></div>
    </div>
    <div class="stat" title="Paid liens only: the clinic confirmed the money arrived. Payment Sent (the attorney says it's on its way) is not added in.">
      <div class="stat-label">Collected</div>
      <div id="collected-value" class="stat-value num">—</div>
      <div id="collected-sub" class="stat-sub num"></div>
    </div>
    <div class="stat" title="Mean % off the lien, across liens with an agreed payoff or a recorded paid amount.">
      <div class="stat-label">Average reduction</div>
      <div id="reduction-value" class="stat-value num">—</div>
      <div id="reduction-sub" class="stat-sub num"></div>
    </div>
  </div>

  <main>
    <section aria-labelledby="cases-h">
      <div class="col-head"><h2 id="cases-h">Cases</h2><span id="cases-count" class="count num"></span></div>
      <div id="cases" class="scroll"></div>
    </section>

    <section aria-labelledby="stages-h">
      <div class="col-head"><h2 id="stages-h">By stage</h2><span id="stages-count" class="count num"></span></div>
      <div class="scroll">
        <div id="stages" role="list"></div>
        <div class="svc">
          <div class="svc-head">
            <div>
              <div class="svc-title">Collected vs outstanding</div>
              <div id="svc-sub" class="svc-sub"></div>
            </div>
            <button id="svc-table-btn" class="link-btn" type="button" aria-expanded="false">Show table</button>
          </div>
          <div class="legend"><span><i class="sw collected"></i>Collected</span><span><i class="sw outstanding"></i>Outstanding</span></div>
          <div id="svc-plot"></div>
          <div id="svc-table" hidden></div>
        </div>
      </div>
    </section>

    <section aria-labelledby="actions-h">
      <div class="col-head"><h2 id="actions-h">Actions needed</h2><span id="actions-count" class="count num"></span></div>
      <div id="actions" class="scroll"></div>
    </section>
  </main>

  <dialog id="case-dialog" class="case-dialog" aria-labelledby="cd-name">
    <div class="cd-head">
      <div><h3 id="cd-name"></h3><div id="cd-tags" class="case-tags"></div></div>
      <button type="button" id="cd-close" class="cd-close" aria-label="Close">×</button>
    </div>
    <div id="cd-body" class="cd-body"></div>
  </dialog>

  <dialog id="pay-dialog" class="pay-dialog">
    <form id="pay-form" method="dialog">
      <h3 id="pay-title">Payment received</h3>
      <p id="pay-context"></p>
      <label for="pay-input">Amount received</label>
      <div class="pay-amount"><span>$</span><input id="pay-input" inputmode="decimal" autocomplete="off" /></div>
      <div id="pay-err" class="pay-err" role="alert"></div>
      <div class="pay-actions">
        <button type="button" id="pay-cancel" class="pay-btn">Cancel</button>
        <button type="submit" id="pay-save" class="pay-btn yes">Mark paid</button>
      </div>
    </form>
  </dialog>

  <button id="ask-open" class="chat-fab" type="button" aria-label="Ask LienPilot" aria-expanded="false" title="Ask LienPilot">
    <svg class="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" />
    </svg>
    <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18" />
    </svg>
  </button>
  <aside id="drawer" class="drawer" aria-label="Ask LienPilot" aria-hidden="true">
    <div class="drawer-head">
      <h2>Ask LienPilot</h2>
      <div class="tools">
        <button id="ask-new" class="ghost-btn" type="button">New chat</button>
      </div>
    </div>
    <div id="chat" class="chat" aria-live="polite"></div>
    <form id="composer" class="composer">
      <textarea id="ask-input" rows="2" placeholder="Ask about a patient, a firm, or your liens overall…"></textarea>
      <div class="composer-row">
        <span class="composer-hint">Read-only · answers from LienPilot's records</span>
        <button id="ask-send" class="send-btn" type="submit">Send</button>
      </div>
    </form>
  </aside>

  <script>
    // Stages a lien moves through while it's still owed, in pipeline order.
    const OPEN_STAGES = ["Unknown", "Case Ongoing", "Settlement Pending", "Payment Pending"];
    const CLOSED_STAGES = ["Payment Sent", "Paid", "Closed / Uncollectible"];
    // Where the clinic can confirm a payment arrived (only the clinic can mark Paid).
    const PAYMENT_STAGES = ["Payment Pending", "Payment Sent"];
    const needsPaymentCheck = (l) => PAYMENT_STAGES.includes(l.status);
    const payButtons = (l) => `
      <div class="pay-confirm" data-lien="${l.id}" data-name="${esc(l.patient_name)}">
        <span>Received payment?</span>
        <button type="button" class="pay-btn yes" data-received="yes">Yes</button>
        <button type="button" class="pay-btn" data-received="no">No</button>
      </div>`;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const money = (n) => "$" + Math.round(Number(n) || 0).toLocaleString();
    const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

    function daysSince(iso, todayIso) {
      if (!iso) return null;
      const a = new Date(String(iso).slice(0, 10) + "T00:00:00");
      const b = new Date(todayIso + "T00:00:00");
      return Math.round((b - a) / 86_400_000);
    }

    function isOpen(l) {
      return !CLOSED_STAGES.includes(l.status);
    }

    // ---- Left: cases ----
    // Cases grouped by attorney. Group by name + firm, not email: one inbox can
    // stand in for several attorneys (as in testing). Expanded groups are
    // remembered so the 15-second refresh doesn't collapse them.
    const openAttorneys = new Set();

    const caseTags = (l) => [
      `<span class="tag">${esc(l.status || "Unknown")}</span>`,
      (l.open_requests || []).length ? `<span class="tag solid">Action needed${l.open_requests.length > 1 ? ` (${l.open_requests.length})` : ""}</span>` : "",
      l.awaiting_reply ? `<span class="tag quiet">Awaiting attorney</span>` : "",
    ].join("");

    function caseCard(l) {
      const days = l.days_since_contact;
      const contact = days == null ? "Never contacted" : `${days}d since contact`;
      const tags = caseTags(l);
      return `
        <div class="case" data-lien="${l.id}" role="button" tabindex="0" aria-label="Open ${esc(l.patient_name)}">
          <div class="case-top">
            <span class="case-name">${esc(l.patient_name)}</span>
            <span class="case-amount num">${money(l.lien_amount)}</span>
          </div>
          <div class="case-meta num">${contact}</div>
          <div class="case-tags">${tags}</div>
          ${needsPaymentCheck(l) ? payButtons(l) : ""}
        </div>`;
    }

    function renderCases(liens) {
      if (!liens.length) {
        $("cases-count").textContent = plural(0, "case");
        $("cases").innerHTML = `<div class="empty">No cases yet. Import a CSV from the agent console.</div>`;
        return;
      }
      const groups = new Map();
      for (const l of liens) {
        const name = (l.attorney_name || "").trim() || "No attorney on file";
        const firm = (l.firm_name || "").trim();
        const key = `${name}|${firm}`;
        if (!groups.has(key)) groups.set(key, { key, name, firm, liens: [] });
        groups.get(key).liens.push(l);
      }
      const sorted = [...groups.values()].sort((a, b) => a.name.localeCompare(b.name) || a.firm.localeCompare(b.firm));
      $("cases-count").textContent = `${plural(sorted.length, "attorney")} · ${plural(liens.length, "case")}`;

      $("cases").innerHTML = sorted.map((g) => {
        // Inside a group: open cases first, then largest balance.
        g.liens.sort((a, b) => (isOpen(b) - isOpen(a)) || (Number(b.lien_amount) - Number(a.lien_amount)));
        const total = g.liens.reduce((s, l) => s + (Number(l.lien_amount) || 0), 0);
        const actions = g.liens.reduce((s, l) => s + (l.open_requests || []).length + (needsPaymentCheck(l) ? 1 : 0), 0);
        return `
          <details class="attorney group" data-key="${esc(g.key)}"${openAttorneys.has(g.key) ? " open" : ""}>
            <summary>
              <span class="attorney-main">
                <span class="attorney-name">${esc(g.name)}</span>
                <span class="attorney-firm">${esc(g.firm || "Firm not on file")}</span>
              </span>
              <span class="attorney-side">
                <span class="attorney-total num">${money(total)}</span>
                <span class="attorney-count num">${plural(g.liens.length, "case")}${actions ? ` · <b>${actions} action${actions === 1 ? "" : "s"} needed</b>` : ""}</span>
              </span>
            </summary>
            <div class="attorney-cases">${g.liens.map(caseCard).join("")}</div>
          </details>`;
      }).join("");
    }

    // ---- Summary strip ----
    // What a lien is expected to bring in: the agreed payoff once a reduction is
    // accepted, otherwise the full lien.
    const owed = (l) => Number(l.reduced_amount ?? l.lien_amount) || 0;
    function renderSummary(liens) {
      const open = liens.filter(isOpen);
      $("open-value").textContent = money(open.reduce((s, l) => s + owed(l), 0));
      $("open-sub").textContent = `across ${plural(open.length, "open lien")}`;

      // Collected: confirmed by the clinic only. Liens marked Paid before amounts
      // were recorded count at what was owed, and the line says how many.
      const paid = liens.filter((l) => l.status === "Paid");
      const sent = liens.filter((l) => l.status === "Payment Sent");
      const unrecorded = paid.filter((l) => l.paid_amount == null).length;
      $("collected-value").textContent = money(paid.reduce((s, l) => s + Number(l.paid_amount ?? owed(l)), 0));
      $("collected-sub").textContent = `from ${plural(paid.length, "paid lien")}` +
        (sent.length ? ` · ${money(sent.reduce((s, l) => s + owed(l), 0))} sent` : "") +
        (unrecorded ? ` · ${unrecorded} at full lien` : "");

      // Average reduction: mean % off across liens with an agreed payoff, or Paid
      // with a recorded amount; the dollars given up sit under it.
      const settled = liens
        .map((l) => ({ l, payoff: l.reduced_amount ?? (l.status === "Paid" ? l.paid_amount : null) }))
        .filter((x) => x.payoff != null && Number(x.l.lien_amount) > 0);
      if (settled.length) {
        const avg = settled.reduce((s, x) => s + (1 - x.payoff / x.l.lien_amount), 0) / settled.length;
        $("reduction-value").textContent = `${(avg * 100).toFixed(1)}%`;
        $("reduction-sub").textContent = `${money(settled.reduce((s, x) => s + (x.l.lien_amount - x.payoff), 0))} off · ${plural(settled.length, "lien")}`;
      } else {
        $("reduction-value").textContent = "—";
        $("reduction-sub").textContent = "no payoffs agreed yet";
      }

      // Every open stage shows, even at zero, so the pipeline reads the same every time.
      $("stages-count").textContent = `${open.length} open`;
      // Bar length is the count, scaled to the biggest stage; hover shows the balance.
      const rows = OPEN_STAGES.map((stage) => {
        const inStage = open.filter((l) => (l.status || "Unknown") === stage);
        return { stage, n: inStage.length, amount: inStage.reduce((s, l) => s + owed(l), 0) };
      });
      const max = Math.max(1, ...rows.map((r) => r.n));
      $("stages").innerHTML = rows.map((r) => `
        <div class="stage${r.n ? "" : " zero"}" role="listitem" title="${esc(`${r.stage}: ${plural(r.n, "lien")}, ${money(r.amount)}`)}">
          <div class="stage-top"><span class="stage-name">${esc(r.stage)}<span class="stage-amt num">${money(r.amount)}</span></span><span class="stage-n num">${r.n}</span></div>
          <span class="stage-track"><span class="stage-fill" style="width:${(r.n / max) * 100}%"></span></span>
        </div>`).join("");
    }

    // ---- Collected vs outstanding over time ----
    // Stacked areas, one point per day from the first day on record to today.
    // Each lien's stage on a day comes from status_history; before a lien's first
    // recorded change it's the "from" stage of that change, and with no history at
    // all it's the current stage. A Paid lien counts as outstanding until its
    // paid_date, collected (at paid_amount) from then on. Dollars use today's
    // agreed payoff (reductions aren't historized), so today's point matches the strip.
    let svcPoints = [];
    let svcTable = false;
    const SVC_H = 190, SVC_LEFT = 44, SVC_BOTTOM = 22, SVC_TOP = 8;

    function niceMax(v) {
      if (v <= 0) return 1000;
      const p = 10 ** Math.floor(Math.log10(v));
      return [1, 2, 2.5, 5, 10].map((m) => m * p).find((m) => m >= v);
    }
    const shortMoney = (n) => n >= 1000 ? `$${+(n / 1000).toFixed(n % 1000 ? 1 : 0)}K` : `$${n}`;
    const dayLabel = (k, opts) => new Date(`${k}T00:00:00`).toLocaleString("en-US", opts);
    const localDay = (utc) => { const d = new Date(utc); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
    const nextDay = (k) => { const d = new Date(`${k}T00:00:00`); d.setDate(d.getDate() + 1); return localDay(d); };

    function renderServiceChart(liens, history, todayIso) {
      const byLien = new Map();
      for (const h of history) {
        if (!byLien.has(h.lien_id)) byLien.set(h.lien_id, []);
        byLien.get(h.lien_id).push({ day: localDay(h.changed_at), from: h.from_status, to: h.to_status });
      }
      const starts = [...history.map((h) => localDay(h.changed_at)), ...liens.filter((l) => l.status === "Paid" && l.paid_date).map((l) => l.paid_date)]
        .filter((d) => d <= todayIso).sort();
      const first = starts[0] || todayIso;

      const statusOn = (l, day) => {
        const rows = byLien.get(l.id);
        if (!rows) return l.status === "Paid" && l.paid_date && day < l.paid_date ? "Payment Pending" : l.status;
        let st = rows[0].from; // null: the lien didn't exist yet
        for (const r of rows) { if (r.day <= day) st = r.to; else break; }
        return st;
      };

      const points = [];
      for (let day = first; day <= todayIso; day = nextDay(day)) {
        let collected = 0, outstanding = 0, open = 0;
        for (const l of liens) {
          const st = statusOn(l, day);
          if (!st) continue;
          if (st === "Paid" && (!l.paid_date || l.paid_date <= day)) collected += Number(l.paid_amount ?? owed(l)) || 0;
          else if (st === "Paid" || !CLOSED_STAGES.includes(st)) { outstanding += owed(l); open++; }
        }
        points.push({ k: day, collected, outstanding, open });
      }
      svcPoints = points;
      $("svc-sub").textContent = points.length > 1
        ? `daily since ${dayLabel(first, { month: "short", day: "numeric" })}, when LienPilot's history starts`
        : "history starts today; this fills in day by day";
      drawServiceChart();

      $("svc-table").innerHTML = `
        <table class="svc-table num">
          <thead><tr><th>Day</th><th>Open liens</th><th>Collected</th><th>Outstanding</th></tr></thead>
          <tbody>${points.slice().reverse().map((pt) => `<tr><td>${esc(dayLabel(pt.k, { month: "short", day: "numeric", year: "numeric" }))}</td><td>${pt.open}</td>
            <td>${money(pt.collected)}</td><td>${money(pt.outstanding)}</td></tr>`).join("")}</tbody>
        </table>`;
    }

    // Drawn at the plot's real pixel width (no viewBox scaling, so text stays 11px).
    function drawServiceChart() {
      const plot = $("svc-plot");
      const months = svcPoints;
      if (!months.length) return;
      const W = Math.max(200, plot.clientWidth);
      const innerW = W - SVC_LEFT, innerH = SVC_H - SVC_TOP - SVC_BOTTOM;
      const top = niceMax(Math.max(...months.map((mo) => mo.collected + mo.outstanding)));
      const n = months.length;
      const x = (i) => SVC_LEFT + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
      const y = (v) => SVC_TOP + innerH - (v / top) * innerH;
      const line = (vals) => vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
      const band = (lo, hi) => line(hi) + lo.map((v, i) => `L${x(n - 1 - i).toFixed(1)},${y(lo[n - 1 - i]).toFixed(1)}`).join("") + "Z";
      const zero = months.map(() => 0);
      const c = months.map((mo) => mo.collected);
      const t = months.map((mo) => mo.collected + mo.outstanding);
      // Thin out x labels when months crowd the width.
      const every = Math.max(1, Math.ceil(n / Math.floor(innerW / 44)));

      plot.innerHTML = `
        <svg width="${W}" height="${SVC_H}" role="img" aria-label="Collected and outstanding lien dollars by day; use Show table for the numbers.">
          ${[0.5, 1].map((f) => `<line class="svc-grid" x1="${SVC_LEFT}" x2="${W}" y1="${y(top * f)}" y2="${y(top * f)}"/>
            <text x="${SVC_LEFT - 8}" y="${y(top * f) + 4}" text-anchor="end">${shortMoney(top * f)}</text>`).join("")}
          <text x="${SVC_LEFT - 8}" y="${y(0) + 4}" text-anchor="end">$0</text>
          <path class="svc-outstanding" d="${band(c, t)}"/>
          <path class="svc-collected" d="${band(zero, c)}"/>
          <path class="svc-gap" d="${line(c)}"/>
          <path class="svc-edge" d="${line(t)}"/>
          <line class="svc-base" x1="${SVC_LEFT}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>
          ${months.map((mo, i) => i % every ? "" : `<text x="${x(i)}" y="${SVC_H - 4}" text-anchor="${n > 1 && i === 0 ? "start" : n > 1 && i === n - 1 ? "end" : "middle"}">${esc(dayLabel(mo.k, { month: "short", day: "numeric" }))}</text>`).join("")}
          <line class="svc-cross" y1="${SVC_TOP}" y2="${y(0)}"/>
          <circle class="svc-dot" data-s="t" r="4"/>
          <circle class="svc-dot" data-s="c" r="4"/>
        </svg>
        <div class="svc-tip" role="status"></div>`;

      // Crosshair: snaps to the nearest month; one tooltip lists both series.
      const svg = plot.querySelector("svg");
      const tip = plot.querySelector(".svc-tip");
      const show = (i) => {
        const mo = months[i];
        plot.classList.add("hover");
        const cx = x(i);
        const cross = svg.querySelector(".svc-cross");
        cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
        for (const dot of svg.querySelectorAll(".svc-dot")) {
          dot.setAttribute("cx", cx);
          dot.setAttribute("cy", y(dot.dataset.s === "t" ? mo.collected + mo.outstanding : mo.collected));
        }
        tip.textContent = "";
        for (const text of [
          `${dayLabel(mo.k, { month: "short", day: "numeric", year: "numeric" })} · ${plural(mo.open, "open lien")}`,
          `Collected ${money(mo.collected)}`,
          `Outstanding ${money(mo.outstanding)}`,
        ]) { const d = document.createElement("div"); d.textContent = text; tip.appendChild(d); }
        // Right of the crosshair, or left of it when it would run off the edge.
        const tw = tip.offsetWidth;
        tip.style.left = `${cx + 12 + tw > W ? Math.max(0, cx - 12 - tw) : cx + 12}px`;
      };
      svg.addEventListener("pointermove", (e) => {
        const px = e.clientX - svg.getBoundingClientRect().left;
        const i = n === 1 ? 0 : Math.round(((px - SVC_LEFT) / innerW) * (n - 1));
        show(Math.min(n - 1, Math.max(0, i)));
      });
      svg.addEventListener("pointerleave", () => plot.classList.remove("hover"));
    }

    $("svc-table-btn").addEventListener("click", (e) => {
      svcTable = !svcTable;
      $("svc-table").hidden = !svcTable;
      e.target.textContent = svcTable ? "Hide table" : "Show table";
      e.target.setAttribute("aria-expanded", String(svcTable));
    });
    new ResizeObserver(() => drawServiceChart()).observe($("svc-plot"));

    // ---- Right: actions needed (what's waiting on the clinic) ----
    // Actions grouped by the clinic desk that owns them. Every roster desk shows
    // (an empty desk says so). Every desk starts collapsed; the header's count
    // shows what's inside. Open/close choices are remembered across refreshes.
    const deskOpen = new Map();

    function actionCard(it, today) {
      const age = daysSince(it.opened, today);
      // With an email on file, the card opens that email in the owner's Gmail.
      const tag = it.link ? "a" : "div";
      const attrs = it.link
        ? ` href="${esc(it.link)}" target="_blank" rel="noopener" title="Open in ${esc(it.owner || "the owner")}'s Gmail"`
        : "";
      return `
        <${tag} class="action"${attrs}>
          <div class="action-cat">${esc(it.category)}</div>
          <div class="action-who">${esc(it.lien.patient_name)} <span style="font-weight:400;color:var(--muted)">· ${esc(it.lien.firm_name || it.lien.attorney_name || "")}</span></div>
          ${it.text && it.text.trim().toLowerCase() !== String(it.category).trim().toLowerCase() ? `<div class="action-text">${esc(it.text)}</div>` : ""}
          <div class="action-age num">${age == null ? "" : age === 0 ? "Opened today" : `Open ${plural(age, "day")}`}</div>
          ${it.link ? `<div class="action-open">Open email ↗</div>` : ""}
          ${it.payCheck ? payButtons(it.lien) : ""}
        </${tag}>`;
    }

    function renderActions(liens, today, contacts = []) {
      const items = [];
      for (const l of liens) {
        const reqs = l.open_requests || [];
        if (reqs.length) {
          for (const r of reqs) items.push({ lien: l, category: r.category, text: r.text, opened: r.opened, link: r.email_link, owner: r.owner });
        } else if (l.action_needed) {
          items.push({ lien: l, category: l.action_needed, text: "", opened: null, owner: "" });
        }
        if (needsPaymentCheck(l)) {
          const payDesk = contacts.find((c) => (c.handles || []).includes("Payment Issue")) || contacts.find((c) => c.default) || {};
          items.push({
            lien: l,
            category: "Confirm payment received",
            text: l.status === "Payment Sent"
              ? "The attorney says payment was sent. Did it arrive?"
              : "Payment is expected. Has it arrived?",
            opened: null,
            owner: payDesk.name || "",
            payCheck: true,
          });
        }
      }
      $("actions-count").textContent = plural(items.length, "action") + " needed";

      // Roster desks in roster order, then any owner not on the roster, then unassigned.
      const desks = contacts.map((c) => ({ name: c.name, items: [] }));
      const byName = new Map(desks.map((d) => [d.name, d]));
      for (const it of items) {
        const name = it.owner || "Unassigned";
        if (!byName.has(name)) { const d = { name, items: [] }; desks.push(d); byName.set(name, d); }
        byName.get(name).items.push(it);
      }
      if (!desks.length) {
        $("actions").innerHTML = `<div class="empty">No actions needed right now.</div>`;
        return;
      }

      $("actions").innerHTML = desks.map((d) => {
        // Oldest first: the longest-waiting ask is the most urgent.
        d.items.sort((a, b) => String(a.opened || "9999").localeCompare(String(b.opened || "9999")));
        const oldest = d.items.length ? daysSince(d.items[0].opened, today) : null;
        const open = deskOpen.get(d.name) === true; // collapsed until opened
        const summary = d.items.length
          ? `${d.items.length} open${oldest ? ` · oldest ${plural(oldest, "day")}` : ""}`
          : "nothing open";
        return `
          <details class="desk group" data-desk="${esc(d.name)}"${open ? " open" : ""}>
            <summary>
              <span class="attorney-main"><span class="attorney-name">${esc(d.name)}</span></span>
              <span class="attorney-side"><span class="attorney-count num">${d.items.length ? `<b>${summary}</b>` : summary}</span></span>
            </summary>
            <div class="attorney-cases">${
              d.items.length ? d.items.map((it) => actionCard(it, today)).join("") : `<div class="group-empty">Nothing waiting on this desk.</div>`
            }</div>
          </details>`;
      }).join("");
    }

    async function load() {
      try {
        const res = await fetch("/api/liens");
        const data = await res.json();
        const liens = data.liens || [];
        liensById = new Map(liens.map((l) => [l.id, l]));
        today = data.today;
        $("as-of").textContent = `As of ${data.today}${data.clock_offset_days ? ` (+${data.clock_offset_days}d simulated)` : ""}`;
        renderCases(liens);
        renderSummary(liens);
        renderServiceChart(liens, data.status_history || [], data.today);
        renderActions(liens, data.today, data.clinic_contacts || []);
        if (caseDialog.open) renderCaseDetail();
      } catch (err) {
        $("as-of").textContent = "Can't reach the server";
      }
    }

    $("actions").addEventListener("toggle", (e) => {
      const desk = e.target.dataset?.desk;
      if (desk) deskOpen.set(desk, e.target.open);
    }, true);
    // Received payment? Yes → asks how much arrived, then Paid (closes the case).
    // No → stays/reopens Payment Pending.
    let liensById = new Map();
    let payingLien = null;
    const payDialog = $("pay-dialog");

    async function postPayment(id, body) {
      const res = await fetch(`/api/liens/${id}/payment-received`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Couldn't save that.");
    }

    document.addEventListener("click", async (e) => {
      const btn = e.target.closest(".pay-confirm .pay-btn");
      if (!btn) return;
      const box = btn.closest(".pay-confirm");
      const lien = liensById.get(Number(box.dataset.lien));
      if (btn.dataset.received === "yes") {
        if (!lien) return;
        payingLien = lien;
        $("pay-title").textContent = `Payment received: ${lien.patient_name}`;
        $("pay-context").textContent =
          `Lien ${money(lien.lien_amount)}` + (lien.reduced_amount != null ? ` · agreed payoff ${money(lien.reduced_amount)}` : "") +
          ". Marking it paid closes the case.";
        $("pay-input").value = String(lien.reduced_amount ?? lien.lien_amount);
        $("pay-err").textContent = "";
        $("pay-save").disabled = false;
        payDialog.showModal();
        $("pay-input").select();
        return;
      }
      box.querySelectorAll("button").forEach((b) => { b.disabled = true; });
      try { await postPayment(box.dataset.lien, { received: false }); } catch (err) { alert(err.message); }
      load();
    });

    $("pay-cancel").addEventListener("click", () => payDialog.close());
    $("pay-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const amount = Number($("pay-input").value.replace(/[$,\s]/g, ""));
      if (!(amount > 0)) { $("pay-err").textContent = "Enter the amount that arrived."; return; }
      if (amount > Number(payingLien.lien_amount)) {
        $("pay-err").textContent = `That's more than the ${money(payingLien.lien_amount)} lien.`;
        return;
      }
      $("pay-save").disabled = true;
      try {
        await postPayment(payingLien.id, { received: true, amount });
        payDialog.close();
      } catch (err) {
        $("pay-err").textContent = err.message;
        $("pay-save").disabled = false;
      }
      load();
    });
    $("cases").addEventListener("toggle", (e) => {
      const key = e.target.dataset?.key;
      if (!key) return;
      if (e.target.open) openAttorneys.add(key);
      else openAttorneys.delete(key);
    }, true);

    // ---- Case detail ----
    // Everything comes from the lien row already loaded: facts, what the clinic
    // owes, and the notes log (LienPilot's dated record), newest first. Re-rendered
    // on each refresh so it stays live while open.
    let today = "";
    let openCaseId = null;
    const caseDialog = $("case-dialog");

    function renderCaseDetail() {
      const l = liensById.get(openCaseId);
      if (!l) { caseDialog.close(); return; }
      $("cd-name").textContent = l.patient_name;
      $("cd-tags").innerHTML = caseTags(l);

      const days = l.days_since_contact;
      const facts = [
        ["Attorney", `${esc(l.attorney_name || "Not on file")}${l.firm_name ? ` · ${esc(l.firm_name)}` : ""}`],
        ["Attorney email", esc(l.attorney_email || "—")],
        ["Date of service", esc(l.date_of_service || "—")],
        ["Lien amount", money(l.lien_amount)],
        ["Agreed payoff", l.reduced_amount != null ? money(l.reduced_amount) : "Full lien"],
        ["Last attorney contact", l.last_contact_date ? `${esc(l.last_contact_date)} (${plural(days, "day")} ago)` : "Never contacted"],
      ];
      if (l.status === "Paid") facts.push(["Paid", l.paid_amount != null ? `${money(l.paid_amount)}${l.paid_date ? ` on ${esc(l.paid_date)}` : ""}` : "Amount not recorded"]);

      const reqs = l.open_requests || [];
      const reqHtml = reqs.length ? reqs.map((r) => {
        const age = daysSince(r.opened, today);
        return `<div class="cd-req">
          <div class="action-cat">${esc(r.category)}</div>
          ${r.text && r.text.trim().toLowerCase() !== String(r.category).trim().toLowerCase() ? `<div>${esc(r.text)}</div>` : ""}
          <div class="sub num">${esc(r.owner || "Unassigned")}${age == null ? "" : age === 0 ? " · opened today" : ` · open ${plural(age, "day")}`}</div>
          ${r.email_link ? `<a href="${esc(r.email_link)}" target="_blank" rel="noopener">Open email ↗</a>` : ""}
        </div>`;
      }).join("") : `<div class="cd-none">Nothing waiting on the clinic.</div>`;

      // Notes are "[YYYY-MM-DD] text" lines, oldest first.
      const log = String(l.notes || "").split("\n").map((line) => line.trim()).filter(Boolean).reverse()
        .map((line) => {
          const m = line.match(/^\[(\d{4}-\d{2}-\d{2})\]\s*(.*)$/);
          return `<li>${m ? `<span class="when num">${esc(m[1])}</span>${esc(m[2])}` : esc(line)}</li>`;
        }).join("");

      // Keep both scroll positions across the 15-second refresh.
      const bodyTop = $("cd-body").scrollTop;
      const logTop = $("cd-body").querySelector(".cd-log")?.scrollTop || 0;
      $("cd-body").innerHTML = `
        <div id="cd-summary" class="cd-summary"></div>
        ${needsPaymentCheck(l) ? `<div class="cd-section">${payButtons(l)}</div>` : ""}
        <div class="cd-section"><dl class="cd-facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd class="num">${v}</dd></div>`).join("")}</dl></div>
        <div class="cd-section"><h4>Waiting on the clinic</h4>${reqHtml}</div>
        <div class="cd-section cd-activity"><h4>Activity</h4>${log ? `<ol class="cd-log">${log}</ol>` : `<div class="cd-none">No activity yet.</div>`}</div>`;
      $("cd-body").scrollTop = bodyTop;
      const logEl = $("cd-body").querySelector(".cd-log");
      if (logEl) logEl.scrollTop = logTop;
      renderSummaryBox(l);
    }

    // AI summary at the top of the panel. Fetched only when the case changes
    // (the server caches too), so the 15-second refresh doesn't ask again.
    let summary = { sig: "", state: "idle", data: null };
    const caseSig = (l) => JSON.stringify([l.id, today, l.status, l.notes, l.open_requests, l.awaiting_reply, l.reduced_amount, l.paid_amount]);

    function renderSummaryBox(l) {
      const box = $("cd-summary");
      if (!box) return;
      const sig = caseSig(l);
      if (summary.sig !== sig) {
        summary = { sig, state: "loading", data: null };
        fetch(`/api/liens/${l.id}/summary`)
          .then(async (res) => {
            const data = await res.json().catch(() => ({})); // e.g. an older server without this route
            if (!res.ok || !data.summary) throw new Error(data.error || "Summary isn't available right now.");
            return data;
          })
          .then((data) => { if (summary.sig === sig) { summary = { sig, state: "done", data }; renderSummaryBox(l); } })
          .catch((err) => { if (summary.sig === sig) { summary = { sig, state: "error", data: err.message }; renderSummaryBox(l); } });
      }
      box.classList.toggle("loading", summary.state === "loading");
      box.innerHTML = `<h4>Where it stands</h4>` + (
        summary.state === "done"
          ? `<p>${esc(summary.data.summary)}</p><p class="next">${esc(summary.data.next)}</p>
             <div class="note">AI summary of the activity below</div>`
          : summary.state === "error" ? `<p class="cd-none">${esc(summary.data)}</p>`
          : `<p>Summarizing…</p>`);
    }

    function openCase(id) {
      openCaseId = id;
      renderCaseDetail();
      if (!caseDialog.open) caseDialog.showModal();
      $("cd-body").scrollTop = 0;
      const logEl = $("cd-body").querySelector(".cd-log");
      if (logEl) logEl.scrollTop = 0;
    }

    $("cases").addEventListener("click", (e) => {
      if (e.target.closest(".pay-confirm")) return; // payment buttons act on their own
      const card = e.target.closest(".case[data-lien]");
      if (card) openCase(Number(card.dataset.lien));
    });
    $("cases").addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const card = e.target.closest(".case[data-lien]");
      if (card && e.target === card) { e.preventDefault(); openCase(Number(card.dataset.lien)); }
    });
    $("cd-close").addEventListener("click", () => caseDialog.close());
    caseDialog.addEventListener("click", (e) => { if (e.target === caseDialog) caseDialog.close(); }); // backdrop
    caseDialog.addEventListener("close", () => { openCaseId = null; });

    // ---- Ask LienPilot (read-only chat) ----
    const SUGGESTIONS = [
      "What's going on with Nina Patel?",
      "What are attorneys waiting on from Records?",
      "Any updates this week?",
    ];
    let chatHistory = []; // [{ role: "staff" | "lienpilot", text }]
    let asking = false;

    function setDrawer(open) {
      document.body.classList.toggle("drawer-open", open);
      $("drawer").setAttribute("aria-hidden", String(!open));
      $("ask-open").setAttribute("aria-expanded", String(open));
      $("ask-open").setAttribute("aria-label", open ? "Close chat" : "Ask LienPilot");
      if (open) setTimeout(() => $("ask-input").focus(), 50);
    }

    function renderChatEmpty() {
      $("chat").innerHTML = `
        <div class="chat-empty">
          <p>Ask about any lien: a patient, a firm, a status, or what's happened lately. Answers come from LienPilot's records; nothing is changed.</p>
          ${SUGGESTIONS.map((q) => `<button type="button" class="suggestion">${esc(q)}</button>`).join("")}
        </div>`;
    }

    function addMessage(role, text, facts = []) {
      if ($("chat").querySelector(".chat-empty")) $("chat").innerHTML = "";
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      if (facts.length) {
        const d = document.createElement("details");
        d.innerHTML = `<summary>Facts used</summary><pre>${esc(facts.join("\n\n"))}</pre>`;
        div.appendChild(d);
      }
      $("chat").appendChild(div);
      $("chat").scrollTop = $("chat").scrollHeight;
      return div;
    }

    async function ask(question) {
      question = question.trim();
      if (!question || asking) return;
      asking = true;
      $("ask-send").disabled = true;
      $("ask-input").value = "";
      addMessage("staff", question);
      const thinking = addMessage("thinking", "Looking that up…");
      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, history: chatHistory }),
        });
        const data = await res.json();
        thinking.remove();
        if (!res.ok) throw new Error(data.error || "Something went wrong.");
        addMessage("lienpilot", data.answer, data.facts || []);
        chatHistory.push({ role: "staff", text: question }, { role: "lienpilot", text: data.answer });
      } catch (err) {
        thinking.remove();
        addMessage("error", err.message);
      } finally {
        asking = false;
        $("ask-send").disabled = false;
        $("ask-input").focus();
      }
    }

    $("ask-open").addEventListener("click", () => setDrawer(!document.body.classList.contains("drawer-open")));
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.body.classList.contains("drawer-open")) setDrawer(false);
    });
    $("ask-new").addEventListener("click", () => { chatHistory = []; renderChatEmpty(); $("ask-input").focus(); });
    $("chat").addEventListener("click", (e) => {
      const s = e.target.closest(".suggestion");
      if (s) ask(s.textContent);
    });
    $("composer").addEventListener("submit", (e) => { e.preventDefault(); ask($("ask-input").value); });
    $("ask-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask($("ask-input").value); }
    });
    renderChatEmpty();

    load();
    setInterval(load, 15000); // stays current as the agent works
  </script>
</body>
</html>
